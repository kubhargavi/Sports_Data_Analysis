{% extends "base.html" %}
{% block content %}
<h2>Toxicity Analysis</h2>
<form method="post">
    <label for="tox_class">Toxicity Class:</label>
    <input type="text" name="tox_class" id="tox_class" placeholder="e.g. normal or flag">
    <button type="submit" class="btn btn-primary">Update Plot</button>
</form>

{% if plot_url %}
<div class="mt-3">
  <img src="{{ plot_url }}" alt="Toxicity Class Distribution" class="img-fluid">
</div>
{% endif %}
{% if message %}
<p class="mt-2">{{ message }}</p>
{% endif %}

{% endblock %}
